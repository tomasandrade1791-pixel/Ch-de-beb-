name: Ajustar cartinha de detalhes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Coloca detalhes.jpg apos as regras'
    steps:
      - name: Baixar o estado atual
        uses: actions/checkout@v4

      - name: Trocar somente a cartinha de detalhes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<section id="letter"')
          end = s.find('<section id="gifts"', start)
          if start < 0 or end < 0:
              raise SystemExit('Não encontrei os limites da cartinha de detalhes; nenhuma alteração foi feita.')
          replacement = '<section id="letter" class="view paperReveal"><img src="detalhes.jpg" alt="Detalhes do chá de bebê"></section>\n'
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Gravar e remover este ajuste temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ajustar-detalhes-once.yml
          git add index.html .github/workflows/ajustar-detalhes-once.yml
          git diff --cached --check
          git commit -m "Coloca detalhes.jpg apos as regras"
          git push origin main
