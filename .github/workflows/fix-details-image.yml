name: Fix details image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix only the details image reference
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'file_000000007f04820e9ff7fd2ea074c872.png?v=20261002-3'
          new = 'detalhes-cha-bebe.png?v=20261002'
          marker = '<section id="details"'
          start = s.find(marker)
          if start == -1:
              raise SystemExit('details section not found')
          end = s.find('</section>', start)
          if end == -1:
              raise SystemExit('details section end not found')
          section = s[start:end]
          if old in section:
              section = section.replace(old, new)
              s = s[:start] + section + s[end:]
              p.write_text(s, encoding='utf-8')
          else:
              print('Details image already fixed or reference not found; no change needed.')

      - name: Commit fix if needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix details image in invitation'
          git push
