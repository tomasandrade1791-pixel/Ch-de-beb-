name: Corrigir detalhes

on:
  push:
    branches:
      - restauracao-base-estavel

permissions:
  contents: write

jobs:
  fix-details:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Corrigir tela de detalhes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = ".detailsView{background:#000!important;padding:0!important;align-items:flex-start!important;justify-content:center!important;overflow-y:auto!important}.detailsPaper{width:min(100%,864px);min-height:100vh;background:#f4ead5;display:flex;align-items:center;justify-content:center;padding:0;position:relative}.detailsImage{display:block;width:100%;height:auto;max-width:864px}.detailsNav{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(76vw,330px);display:flex;align-items:center;justify-content:center;gap:4px;padding:5px 6px;border-radius:28px;background:#061224f5;z-index:10000;box-shadow:0 4px 20px #0008}.detailsNav span{color:#f4ead5;font-size:9px;white-space:nowrap}.detailsNav .btn{padding:6px 9px;font-size:10px}.paperReveal"

          new = ".detailsView{background:#f4ead5!important;padding:0!important;align-items:flex-start!important;justify-content:center!important;overflow-y:auto!important}.detailsPaper{width:min(100%,864px);min-height:100vh;background:#f4ead5;display:flex;align-items:flex-start;justify-content:center;padding:0;position:relative;overflow:hidden}.detailsImage{display:block;width:100%;height:auto;max-width:864px}.detailsNav{position:absolute;left:0;right:0;bottom:6.5%;height:8%;display:flex;align-items:center;justify-content:center;gap:4px;padding:0;background:transparent;z-index:10000;opacity:0;pointer-events:auto}.detailsNav span{color:transparent;font-size:0;width:26%;height:100%;pointer-events:none}.detailsNav .btn{width:26%;height:100%;padding:0;border:0;background:transparent;color:transparent;opacity:0;pointer-events:auto}.detailsNav .btn:first-child{margin-right:2%}.detailsNav .btn:last-child{margin-left:2%}.paperReveal"

          if old not in s:
              raise SystemExit('Trecho esperado da tela de detalhes não foi encontrado; nenhuma alteração feita.')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Salvar correção e remover este workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-details-duplicate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-details-duplicate.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Remove duplicação e bordas da tela de detalhes"
          git push origin HEAD:restauracao-base-estavel
