name: Ajuste temporario dos botoes

on:
  push:
    branches:
      - restauracao-base-estavel

permissions:
  contents: write

jobs:
  ajustar:
    if: ${{ !contains(github.event.head_commit.message, '[button-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Ajustar somente o tamanho e a posicao dos botoes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'id="button-size-fix"' not in text:
              style = '''<style id="button-size-fix">
          .nav{
            position:fixed!important;
            left:50%!important;
            right:auto!important;
            bottom:18px!important;
            transform:translateX(-50%)!important;
            width:min(82vw,420px)!important;
            background:#061224f5!important;
            padding:7px 8px!important;
            border-radius:40px!important;
            display:flex!important;
            justify-content:center!important;
            align-items:center!important;
            gap:7px!important;
            z-index:50!important;
          }
          .nav .btn{
            padding:9px 13px!important;
            font-size:12px!important;
            line-height:1.1!important;
            min-height:38px!important;
            white-space:nowrap!important;
          }
          .nav .counter{
            font-size:11px!important;
            white-space:nowrap!important;
          }
          @media(max-width:420px){
            .nav{width:min(88vw,380px)!important;bottom:14px!important;padding:6px!important;gap:5px!important;}
            .nav .btn{padding:8px 10px!important;font-size:11px!important;min-height:36px!important;}
            .nav .counter{font-size:10px!important;}
          }
          </style>
          '''
              text = text.replace('</head>', style + '</head>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remover este ajuste temporario e publicar
        run: |
          rm -f .github/workflows/ajuste-botoes-temporario.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/ajuste-botoes-temporario.yml
          git commit -m "Ajusta tamanho e fixa botoes [button-fix]"
          git push
