name: One-time details button
on:
  push:
    branches: [restauracao-base-estavel]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover redirecionamento antigo da página de detalhes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "document.addEventListener('click',function(e){if(e.target.id==='detailsBack'||e.target.closest('#detailsBack')){e.preventDefault();ri=rules.length-1;show('rules')}if(e.target.id==='detailsNext'||e.target.closest('#detailsNext')){e.preventDefault();show('letter')}},true);"
          if old not in s:
              raise SystemExit('Redirecionamento antigo não encontrado; nenhuma alteração feita.')
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Salvar e remover workflow temporário
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-details-button.yml
          git add index.html
          git commit -m 'Finaliza botão de lista de presentes'
          for i in 1 2 3 4 5; do
            git pull --rebase origin restauracao-base-estavel || true
            git push origin HEAD:restauracao-base-estavel && exit 0
            sleep 3
          done
          exit 1