name: One-time details button
on:
  push:
    branches: [restauracao-base-estavel]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar botão da página de detalhes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_html = '<div class="detailsNav"><button class="btn" id="detailsBack">‹ VOLTAR</button><span>DETALHES</span><button class="btn" id="detailsNext">PRÓXIMO ›</button></div>'
          new_html = '<div class="detailsNav"><button class="btn" id="detailsNext" onclick="show(\'gifts\')">🎁 VER LISTA DE PRESENTES</button></div>'
          old_css = '.detailsNav .btn{width:26%;height:30px;padding:6px 8px;border:1px solid var(--gold);background:var(--cream);color:var(--navy);opacity:1;pointer-events:auto}.detailsNav .btn:first-child{margin-right:2%}.detailsNav .btn:last-child{margin-left:2%}'
          new_css = '.detailsNav .btn{width:70%;max-width:280px;height:40px;padding:8px 14px;border:1px solid var(--gold);background:var(--cream);color:var(--navy);opacity:1;pointer-events:auto}'
          if old_html not in s:
              raise SystemExit('HTML esperado da navegação de detalhes não encontrado; nenhuma alteração feita.')
          if old_css not in s:
              raise SystemExit('CSS esperado da navegação de detalhes não encontrado; nenhuma alteração feita.')
          s = s.replace(old_html, new_html, 1)
          s = s.replace(old_css, new_css, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Salvar alteração e remover workflow temporário
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-details-button.yml
          git add index.html
          git commit -m 'Troca navegação final por lista de presentes'
          git push