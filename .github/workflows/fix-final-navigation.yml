name: Fix final navigation

on:
  push:
    branches:
      - restauracao-base-estavel

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Regra 7 to detalhes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir destino do botão final
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function next(){if(ri<rules.length-1){ri++;renderRule();}else{show('letter');}}"
          new = "function next(){if(ri<rules.length-1){ri++;renderRule();}else{show('details');}}"
          if old not in s:
              raise SystemExit('Trecho esperado não encontrado; nenhuma alteração feita.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit da correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Regra 7 to detalhes"
          git push
