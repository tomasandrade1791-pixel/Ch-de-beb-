name: Fix confirmation before gifts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix confirmation before gifts'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir resposta de não comparecimento
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); a=s.find('function respond(ok){'); b=s.find('function renderGifts',a); r=Path('respond-fix.txt').read_text(encoding='utf-8'); assert a>=0 and b>=0; p.write_text(s[:a]+r+s[b:],encoding='utf-8')"

      - name: Commit da correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix confirmation before gifts"
          git push
