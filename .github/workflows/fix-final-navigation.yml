name: Fix confirmation before gifts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix confirmation before gifts'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurar sequência de confirmação antes dos presentes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_details = '<button class="btn" onclick="show(\'gifts\')">🎁 VER LISTA DE PRESENTES</button>'
          new_details = '<button class="btn" onclick="show(\'name\')">🎁 VER LISTA DE PRESENTES</button>'
          if old_details not in s:
              raise SystemExit('Botão da tela de detalhes não encontrado; nenhuma alteração feita.')
          s = s.replace(old_details, new_details, 1)

          old_no = "':'<p>Obrigado por nos avisar. Mesmo de longe, seu carinho estará presente conosco.</p>'"
          new_no = "':'<p>Obrigado por nos avisar. Mesmo de longe, seu carinho estará presente conosco.</p><p>Entendemos e agradecemos por nos avisar. Esperamos poder celebrar outro momento com você. 🤍</p><p style=\"text-align:center\"><button class=\"btn\" onclick=\"show(\\'gifts\\')\">CONTINUAR →</button></p>'"
          if old_no not in s:
              raise SystemExit('Mensagem de não confirmação não encontrada; nenhuma alteração feita.')
          s = s.replace(old_no, new_no, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit da correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix confirmation before gifts"
          git push
