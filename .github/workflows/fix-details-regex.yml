name: Corrigir condição da última regra

on:
  push:
    branches:
      - restauracao-base-estavel

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Aplicar correção da última regra'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir regex da navegação
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<script id="details-navigation-fix">')
          end = s.find('</script>', start)
          if start < 0 or end < 0:
              raise SystemExit('Bloco details-navigation-fix não encontrado.')
          block = s[start:end]
          fixed = block.replace('\\\\s', '\\s').replace('\\\\/', '\\/')
          if fixed == block:
              raise SystemExit('Nenhuma correção necessária no bloco de navegação.')
          s = s[:start] + fixed + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Regex da navegação corrigida.')
          PY

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-details-regex.yml
          git add index.html .github/workflows/fix-details-regex.yml
          git diff --cached --check
          git commit -m "Aplicar correção da última regra"
          git push origin restauracao-base-estavel
