name: Corrigir navegação dos detalhes

on:
  push:
    branches:
      - restauracao-base-estavel

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Corrige navegação dos detalhes'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir navegação
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = "const isLast = counter && /07\\\\s*\\\\/\\\\s*07/.test(counter.textContent || '');"
          new = "const isLast = counter && /07\\s*\\/\\s*07/.test(counter.textContent || '');"
          if old in s:
              s = s.replace(old, new, 1)
          else:
              old2 = "const isLast = counter && /07\\s*\\/\\s*07/.test(counter.textContent || '');"
              if old2 not in s:
                  raise SystemExit('Não encontrei a condição da última regra para corrigir.')

          old3 = "if (counter && /07\\\\s*\\\\/\\\\s*07/.test(counter.textContent || '')) {"
          new3 = "if (counter && /07\\s*\\/\\s*07/.test(counter.textContent || '')) {"
          s = s.replace(old3, new3, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-detalhes-navegacao.yml
          git add index.html .github/workflows/fix-detalhes-navegacao.yml
          git diff --cached --check
          git commit -m "Corrige navegação dos detalhes"
          git push origin restauracao-base-estavel
