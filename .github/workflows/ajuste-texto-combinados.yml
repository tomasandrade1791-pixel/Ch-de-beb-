name: Ajuste seguro do texto dos Combinados

on:
  push:
    branches:
      - restauracao-base-estavel

jobs:
  ajustar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Ajustar apenas o texto dos Combinados
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* AJUSTE-TEXTO-COMBINADOS-4.2 */'

          if marker not in text:
              fix = '''
          /* AJUSTE-TEXTO-COMBINADOS-4.2 */
          .rulesPaper{padding-left:90px;padding-right:90px;color:#4b5260}
          .rulesPaper h1,.rulesPaper .ruleTitle{color:#4b5260!important}
          .rulesPaper .intro,.rulesPaper .ruleBody{color:#4b5260}
          @media(max-width:650px){
            .rulesPaper{padding-left:54px;padding-right:54px}
            .rulesPaper .intro,.rulesPaper .ruleBody{font-size:16px}
          }
          '''
              text = text.replace('</style>', fix + '\n</style>', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Salvar ajuste e remover este controlador
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ajustar área e contraste do texto dos Combinados" || exit 0
          git push
          rm -f .github/workflows/ajuste-texto-combinados.yml
          git add -u .github/workflows/ajuste-texto-combinados.yml
          git commit -m "Remover controlador temporário do ajuste" || true
          git push || true
