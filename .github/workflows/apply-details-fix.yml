name: Aplicar correção definitiva da navegação

on:
  push:
    branches:
      - restauracao-base-estavel

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Aplicar correção definitiva'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir navegação
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const isNext = /PR[ÓO]XIMO/i.test((button.textContent || '').trim());"
          new = "const isNext = /PR[ÓO]XIMO|CONTINUAR/i.test((button.textContent || '').trim());"
          if old not in s:
              raise SystemExit('Linha do botão da última regra não encontrada.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Botão CONTINUAR da última regra agora abre os detalhes.')
          PY

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-details-fix.yml .github/workflows/fix-details-regex.yml .github/fix-trigger.txt .github/fix-trigger2.txt
          git add index.html .github/workflows/apply-details-fix.yml .github/workflows/fix-details-regex.yml .github/fix-trigger.txt .github/fix-trigger2.txt
          git diff --cached --check
          git commit -m "Aplicar correção definitiva"
          git push origin restauracao-base-estavel
