name: Fix details layout
on:
  push:
    branches: [restauracao-base-estavel]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar fundo da cartinha de detalhes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</head>'
          style = '''<style id="details-bow-size-fix">
.detailsPaper{background-size:100% 92%!important;background-position:center top!important;background-repeat:no-repeat!important;background-color:#f4ead5!important}
</style>'''
          if 'details-bow-size-fix' not in s:
              if marker not in s:
                  raise SystemExit('Cabeçalho não encontrado; não alterar nada.')
              s = s.replace(marker, style + marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Ajuste já aplicado.')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Diminui o laço no fundo da cartinha de detalhes'
          git push
