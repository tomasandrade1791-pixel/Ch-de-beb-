name: Ajuste cartinha aberta 2.2
on:
  push:
    branches: [restauracao-base-estavel]
permissions:
  contents: write
jobs:
  ajuste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aumentar somente a cartinha aberta e centralizar
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.envCard.opening #envOpen{opacity:1;transform:scale(1);filter:drop-shadow(0 0 30px rgba(215,184,106,.6))}'
          new='.envCard.opening #envOpen{opacity:1;transform:translate(-50%,-50%) scale(1.06);filter:drop-shadow(0 0 30px rgba(215,184,106,.6))}'
          if old not in s:
              raise SystemExit('Regra exata não encontrada; nenhuma alteração feita.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Publicar e remover workflow temporário
        run: |
          rm .github/workflows/ajuste-aberta-2-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/ajuste-aberta-2-2.yml
          git commit -m 'Ajusta tamanho e centralização da cartinha aberta'
          git push
