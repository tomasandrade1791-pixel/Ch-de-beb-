name: Corrigir transição da Alice uma vez

on:
  push:
    branches:
      - restauracao-base-estavel

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Corrige transição da Alice sem alterar conteúdo'
    steps:
      - name: Baixar estado atual
        uses: actions/checkout@v4

      - name: Corrigir somente a transição Alice -> cartinha
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase-config.js')
          s = p.read_text(encoding='utf-8')
          old = '''  function initAliceToEnvelope(){
    const alice=document.getElementById('alice');
    const env=document.getElementById('env');
    if(!alice||!env||alice.dataset.envelopeTransitionReady)return;
    alice.dataset.envelopeTransitionReady='1';
    let scheduled=false;
    function goToEnvelope(){
      if(scheduled)return;
      scheduled=true;
      setTimeout(function(){
        if(!alice.classList.contains('on'))return;
        document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on');});
        env.classList.add('on');
      },6500);
    }
    const observer=new MutationObserver(function(){if(alice.classList.contains('on'))goToEnvelope();});
    observer.observe(alice,{attributes:true,attributeFilter:['class']});
    if(alice.classList.contains('on'))goToEnvelope();
  }'''
          new = '''  function initAliceToEnvelope(){
    const alice=document.getElementById('alice');
    const env=document.getElementById('env');
    if(!alice||!env||alice.dataset.envelopeTransitionReady)return;
    alice.dataset.envelopeTransitionReady='1';
    let timer=null;
    function goToEnvelope(){
      if(timer)clearTimeout(timer);
      timer=setTimeout(function(){
        document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on');});
        env.classList.add('on');
      },5400);
    }
    function watch(){
      if(alice.classList.contains('on'))goToEnvelope();
    }
    const observer=new MutationObserver(watch);
    observer.observe(alice,{attributes:true,attributeFilter:['class']});
    watch();
  }'''
          if old not in s:
              raise SystemExit('Bloco exato da transição não encontrado; nenhuma alteração feita.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Gravar correção e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-alice-transition-once.yml
          git add supabase-config.js .github/workflows/fix-alice-transition-once.yml
          git diff --cached --check
          git commit -m "Corrige transição da Alice sem alterar conteúdo"
          git push origin restauracao-base-estavel
