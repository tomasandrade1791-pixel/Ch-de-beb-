name: Corrigir detalhes na branch restauracao

on:
  push:
    branches:
      - restauracao-base-estavel

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Corrige detalhes na restauracao-base-estavel'
    steps:
      - name: Baixar a branch correta
        uses: actions/checkout@v4
        with:
          ref: restauracao-base-estavel

      - name: Corrigir somente a imagem de detalhes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="detalhes.jpg?v=20260930"'
          new = 'src="https://raw.githubusercontent.com/tomasandrade1791-pixel/Ch-de-beb-/restauracao-base-estavel/detalhes.jpg?v=20260930-fix"'
          if old not in s:
              raise SystemExit('A referência esperada de detalhes.jpg não foi encontrada; nenhuma alteração foi feita.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Gravar correção e remover o ajuste temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-detalhes-branch.yml
          git add index.html .github/workflows/fix-detalhes-branch.yml
          git diff --cached --check
          git commit -m "Corrige detalhes na restauracao-base-estavel"
          git push origin restauracao-base-estavel
