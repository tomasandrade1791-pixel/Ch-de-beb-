name: Fix no-attendance response

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove continue button from no-attendance message
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase-config.js')
          s = p.read_text(encoding='utf-8')
          old = '''/* Correção final: a opção "não poderei comparecer" termina no próprio recado. */
(function(){
  function hideNoAttendanceContinue(){
    const response=document.getElementById('response');
    if(!response)return;
    const title=document.getElementById('rt');
    const buttons=response.querySelectorAll('button');
    const noShow=title && /NÃO PODEREI|NÃO.*COMPARECER|NÃO PODEREI COMPARECER/i.test(title.textContent||'');
    buttons.forEach(function(btn){
      if(noShow || /CONTINUAR/i.test(btn.textContent||'')){
        if(noShow)btn.remove();
      }
    });
  }
  function watch(){
    hideNoAttendanceContinue();
    const response=document.getElementById('response');
    if(response && !response.dataset.noAttendanceWatch){
      response.dataset.noAttendanceWatch='1';
      new MutationObserver(hideNoAttendanceContinue).observe(response,{subtree:true,childList:true,characterData:true});
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watch);else watch();
  setInterval(hideNoAttendanceContinue,500);
})();'''
          new = '''/* Correção final: "não poderei comparecer" termina no próprio recado, sem qualquer botão. */
(function(){
  function hideNoAttendanceContinue(){
    const response=document.getElementById('response');
    if(!response)return;
    const text=(response.textContent||'').toUpperCase();
    const noShow=text.includes('TUDO BEM SE VOCÊ NÃO CONSEGUIR ESTAR PRESENTE') || text.includes('NÃO PODEREI COMPARECER');
    if(!noShow)return;
    response.querySelectorAll('button').forEach(function(btn){btn.remove();});
    response.querySelectorAll('p').forEach(function(p){
      if(/CONTINUAR/i.test(p.textContent||''))p.remove();
    });
  }
  function watch(){
    hideNoAttendanceContinue();
    const response=document.getElementById('response');
    if(response && !response.dataset.noAttendanceWatch){
      response.dataset.noAttendanceWatch='1';
      new MutationObserver(hideNoAttendanceContinue).observe(response,{subtree:true,childList:true,characterData:true});
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watch);else watch();
  setInterval(hideNoAttendanceContinue,300);
})();'''
          if old not in s:
              raise SystemExit('Target correction block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-no-attendance-button.yml
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js .github/workflows/fix-no-attendance-button.yml
          git commit -m "Remove no-attendance continue button"
          git push
